_format_version: "2.1"
_transform: true

# API gateway: routes /api/* to the Supabase services.
services:
  - name: auth
    url: http://auth:9999
    routes:
      - name: auth
        paths: ["/api/auth"]
        strip_path: false

  - name: rest
    url: http://rest:3000
    routes:
      - name: rest
        paths: ["/api/rest"]
        strip_path: false

  - name: storage
    url: http://storage:5000
    routes:
      - name: storage
        paths: ["/api/storage"]
        strip_path: false

  - name: realtime
    url: http://realtime:4000
    routes:
      - name: realtime
        paths: ["/api/realtime"]
        strip_path: false
